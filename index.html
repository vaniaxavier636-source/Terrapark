*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'Nunito',sans-serif;color:#333}

.card h2{font-family:'Fredoka',sans-serif;color:var(--rosa);margin:0 0 12px;font-size:22px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{font-weight:700;text-align:center;color:var(--azul);font-size:12px}
.day{aspect-ratio:1;background:var(--azul-claro);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
